name: Socle local
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: socle-${{ github.ref }}
  cancel-in-progress: true
env:
  GIT_LFS_SKIP_SMUDGE: '1'
  NO_COLOR: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: memlia_test
          POSTGRES_USER: memlia_test
          POSTGRES_PASSWORD: ci-fictitious-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U memlia_test -d memlia_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.22.3', cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          # Official PGDG manual configuration for Ubuntu 24.04 (noble).
          # https://www.postgresql.org/download/linux/ubuntu/
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Architectures: $(dpkg --print-architecture)
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          [[ "$(/usr/lib/postgresql/17/bin/pg_dump --version)" == "pg_dump (PostgreSQL) 17."* ]]
          [[ "$(/usr/lib/postgresql/17/bin/pg_restore --version)" == "pg_restore (PostgreSQL) 17."* ]]
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: PostgreSQL lifecycle and restoration
        env:
          DATABASE_URL: postgresql://memlia_test:ci-fictitious-disposable-only@127.0.0.1:5432/memlia_test
        run: npm test
      - run: npm run build
      - run: node scripts/compiled-smoke.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Docker context excludes private files
        run: node scripts/context-smoke.mjs
      - name: Actual container lifecycle and restoration
        run: node scripts/container-smoke.mjs
      - name: Retain only fictitious browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
